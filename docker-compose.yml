# Local Postgres for all services. Demo credentials only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: faze
      POSTGRES_PASSWORD: faze
      POSTGRES_DB: faze
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro   # creates faze_dev on first start
volumes:
  pgdata:
