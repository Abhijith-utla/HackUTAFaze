name: ci
on:
  push: { branches: [main, 'agent-*/**'] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: faze, POSTGRES_PASSWORD: faze, POSTGRES_DB: faze }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U faze" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://faze:faze@localhost:5432/faze_dev
      TEST_DATABASE_URL: postgres://faze:faze@localhost:5432/faze
      JWT_SECRET: test-jwt-secret
      INTERNAL_SECRET: test-internal-secret
      SOLANA_CLUSTER: devnet
      SOLANA_TREASURY_PUBKEY: 11111111111111111111111111111112
      PAYMENTS_SIMULATE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build --workspaces --if-present
